{% extends "base.html" %}

{% block content %}
<div class="box">
    <h2>Enter Message for Analysis</h2>
    
    <form method="POST">
        <textarea name="message" placeholder="Paste the suspicious email, SMS, or message here..."></textarea><br>
        <button type="submit">Run Security Scan</button>
    </form>

    {% if result %}
        <div class="result-box {% if 'SCAM' in result %}scam-alert{% elif 'NOT SCAM' in result %}safe-alert{% endif %}">
            <h3>Analysis Result:</h3>
            <p class="result-text">{{ result }}</p>
        </div>
    {% endif %}
</div>
{% endblock %}
